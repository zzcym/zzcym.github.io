name: rebuild index

# 每次往 posts/ 里加文章，自动重新生成 posts.json / feed.xml / sitemap.xml
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: build
        run: node tools/build-index.mjs

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json feed.xml sitemap.xml
          if git diff --staged --quiet; then
            echo "索引没有变化"
          else
            git commit -m "chore: rebuild index [skip ci]"
            git push
          fi
